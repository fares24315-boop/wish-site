<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مركز استقبال الأمنيات</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');

:root{
--bg:#050817;
--panel:#0e1832dd;
--panel2:#111f42;
--line:#ffffff1b;
--text:#f4f8ff;
--muted:#95a5c0;
--cyan:#7ee7ff;
--violet:#bda1ff;
--green:#7dffb2;
--danger:#ff91b8;
--shadow:0 25px 80px #01030e99;
}

*{
box-sizing:border-box;
}

html,
body{
min-height:100%;
margin:0;
}

body{
color:var(--text);
font-family:"Cairo","Segoe UI",Tahoma,sans-serif;

background:
radial-gradient(circle at 70% 0,#273875 0,transparent 35%),
radial-gradient(circle at 8% 85%,#783e8350 0,transparent 28%),
var(--bg);
}

body:before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
opacity:.3;

background-image:
radial-gradient(circle,#fff 0 1px,transparent 1.5px);

background-size:104px 104px;

z-index:-1;
}

.shell{
width:min(1240px,100%);
margin:auto;
padding:25px 22px 38px;
}

.topbar{
display:flex;
align-items:center;
justify-content:space-between;
gap:20px;
margin-bottom:28px;
}

.brand{
display:flex;
align-items:center;
gap:12px;
font-size:18px;
font-weight:800;
}

.brand-mark{
width:39px;
height:39px;

border:1px solid var(--cyan);
border-radius:50%;

display:grid;
place-items:center;

color:var(--cyan);

box-shadow:
0 0 28px #7ee7ff55;
}

.live{
display:flex;
align-items:center;
gap:8px;

color:var(--muted);
font-size:12px;
}

.live i{
width:8px;
height:8px;

background:var(--green);

border-radius:50%;

box-shadow:
0 0 14px var(--green);
}

.heading{
display:flex;
align-items:flex-end;
justify-content:space-between;

gap:20px;

margin-bottom:24px;
}

.heading h1{
font-size:clamp(27px,5vw,46px);

margin:0 0 8px;

line-height:1.2;

background:
linear-gradient(
110deg,
#fff,
var(--cyan),
var(--violet)
);

-webkit-background-clip:text;
background-clip:text;

color:transparent;
}

.heading p{
margin:0;

color:var(--muted);

font-size:13px;
}

.summary{
display:flex;

gap:9px;

align-items:center;

color:var(--muted);

font-size:12px;
}

.summary strong{
color:var(--cyan);

font-size:22px;
}

.workspace{
display:grid;

grid-template-columns:
350px minmax(0,1fr);

gap:18px;

align-items:start;
}

.panel{
border:1px solid var(--line);

border-radius:20px;

background:
linear-gradient(
145deg,
#14234bd9,
#0b1228e8
);

box-shadow:var(--shadow);

backdrop-filter:blur(18px);
}

.inbox{
padding:16px;
}

.panel-title{
display:flex;

align-items:center;

justify-content:space-between;

gap:10px;

margin:0 0 13px;

font-size:15px;
}

.panel-title small{
color:var(--muted);

font-size:11px;

font-weight:400;
}

.wish-list{
display:flex;

flex-direction:column;

gap:9px;

max-height:
calc(100vh - 220px);

overflow:auto;

padding:2px;
}

.wish-item{
width:100%;

text-align:right;

border:1px solid transparent;

border-radius:14px;

padding:13px;

background:#ffffff06;

color:var(--text);

cursor:pointer;

font:inherit;

transition:.2s;
}

.wish-item:hover,
.wish-item.active{
border-color:#7ee7ff66;

background:#7ee7ff10;
}

.wish-item-top{
display:flex;

justify-content:space-between;

gap:10px;

margin-bottom:7px;
}

.wish-item time{
color:#7887a2;

font-size:10px;
}

.wish-item .state{
font-size:10px;

color:var(--green);
}

.wish-item p{
margin:0;

color:#dce8fb;

font-size:12px;

line-height:1.8;

display:-webkit-box;

-webkit-line-clamp:2;

-webkit-box-orient:vertical;

overflow:hidden;
}

.empty{
padding:35px 15px;

text-align:center;

color:var(--muted);

font-size:13px;

line-height:2;
}

.detail{
min-height:500px;

padding:25px;
}

.detail-empty{
min-height:430px;

display:grid;

place-items:center;

text-align:center;

color:var(--muted);
}

.detail-empty .symbol{
font-size:45px;

color:var(--cyan);

margin-bottom:12px;
}

.detail-head{
display:flex;

justify-content:space-between;

align-items:flex-start;

gap:15px;

border-bottom:
1px solid var(--line);

padding-bottom:18px;
}

.detail-head h2{
margin:0 0 6px;

font-size:19px;
}

.detail-meta{
color:var(--muted);

font-size:11px;
}

.tag{
padding:6px 10px;

border-radius:999px;

color:var(--green);

border:
1px solid #7dffb244;

background:#7dffb20b;

font-size:10px;

white-space:nowrap;
}

.received{
margin:23px 0;

padding:22px;

border-right:
2px solid var(--cyan);

border-left:
2px solid var(--violet);

border-radius:14px;

background:#ffffff08;

font-size:20px;

line-height:2;

word-break:break-word;
}

.response-label{
display:block;

color:var(--cyan);

font-size:12px;

margin-bottom:9px;
}

.response-box{
width:100%;

min-height:125px;

resize:vertical;

border:
1px solid #ffffff1e;

border-radius:13px;

padding:14px;

background:#060b1dcc;

color:var(--text);

font:
500 14px/2
"Cairo",
"Segoe UI",
sans-serif;

outline:0;

transition:.2s;
}

.response-box:focus{
border-color:#7ee7ff88;

box-shadow:
0 0 0 4px #7ee7ff12;
}

.detail-actions{
display:flex;

justify-content:space-between;

align-items:center;

gap:13px;

margin-top:14px;
}

.note{
color:var(--muted);

font-size:11px;
}

.send{
border:0;

border-radius:11px;

padding:12px 19px;

background:
linear-gradient(
110deg,
var(--cyan),
#c8f6ff
);

color:#07111d;

cursor:pointer;

font:
800 13px
"Cairo",
sans-serif;

transition:.2s;
}

.send:hover{
transform:translateY(-2px);

box-shadow:
0 11px 28px #7ee7ff3d;
}

.send:disabled{
opacity:.5;

cursor:not-allowed;

transform:none;
}

.previous{
margin-top:23px;

padding-top:20px;

border-top:
1px solid var(--line);
}

.previous h3{
font-size:13px;

margin:0 0 10px;

color:var(--green);
}

.previous p{
margin:0;

color:#e5fff0;

line-height:2;

font-size:14px;
}

.footer{
display:flex;

justify-content:space-between;

color:#697893;

font-size:11px;

border-top:
1px solid var(--line);

padding-top:17px;

margin-top:28px;
}

@media(max-width:850px){

.workspace{
grid-template-columns:1fr;
}

.wish-list{
max-height:280px;
}

.detail{
min-height:0;
}

.detail-empty{
min-height:260px;
}

}

@media(max-width:520px){

.shell{
padding:18px 14px 28px;
}

.heading{
align-items:flex-start;

flex-direction:column;
}

.summary{
align-self:flex-end;
}

.detail{
padding:18px;
}

.detail-actions{
align-items:stretch;

flex-direction:column;
}

.send{
width:100%;
}

.footer{
flex-direction:column;

gap:7px;

text-align:center;
}

}

</style>
</head>

<body>

<div class="shell">

<header class="topbar">

<div class="brand">

<span class="brand-mark">
✦
</span>

<span>
مركز استقبال الأمنيات
</span>

</div>

<div class="live">

<i></i>

<span>
متصل بمساحة الأمنيات
</span>

</div>

</header>


<section class="heading">

<div>

<h1>
بوابة الردود
</h1>

<p>
استقبل الأمنيات القادمة وأرسل ردًا يليق بها.
</p>

</div>


<div class="summary">

<strong id="totalCount">
0
</strong>

<span>
أمنية مستقبلة
</span>

</div>

</section>


<div class="workspace">


<aside class="panel inbox">

<h2 class="panel-title">

الوارد

<small id="unansweredCount">
0 بدون رد
</small>

</h2>


<div
class="wish-list"
id="wishList">
</div>

</aside>


<section
class="panel detail"
id="detail">


<div class="detail-empty">

<div>

<div class="symbol">
✦
</div>

<div>
اختر أمنية من القائمة
<br>
لتكتب لها ردًا من المستقبل
</div>

</div>

</div>


</section>


</div>


<footer class="footer">

<span>
© مساحة أمنية
</span>

<span>
الردود تظهر تلقائيًا في الموقع الآخر
</span>

</footer>


</div>


<script>


/* =====================================================
   رابط Google Apps Script
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbwJLdoui2pmzH-GqtsDZT6ZNJKwkfSSj65rrjHkwfxl-AvhJFNWh-uI7cNBpG8qA5s/exec";


/* =====================================================
   عناصر الصفحة
===================================================== */

const list =
document.getElementById("wishList");

const detail =
document.getElementById("detail");

const totalCount =
document.getElementById("totalCount");

const unansweredCount =
document.getElementById("unansweredCount");


/* =====================================================
   البيانات
===================================================== */

let wishes = [];

let selectedId = null;


/*
   مهم:
   هذا المتغير يمنع أي تحديث أثناء الكتابة.
*/

let userIsTyping = false;


/*
   مؤقت آخر كتابة.
*/

let typingTimer = null;


/* =====================================================
   حماية HTML
===================================================== */

function escapeHtml(value){

return String(value ?? "")
.replace(
/[&<>"']/g,
function(char){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[char];

}
);

}


/* =====================================================
   التاريخ
===================================================== */

function formatDate(value){

if(!value){
return "";
}

const date =
new Date(value);

if(
isNaN(date.getTime())
){
return "";
}

return date.toLocaleString(
"ar-EG",
{
dateStyle:"medium",
timeStyle:"short"
}
);

}


/* =====================================================
   جلب الأمنيات من Google Apps Script
===================================================== */

async function getWishes(){

const response =
await fetch(
API_URL +
"?action=getWishes&t=" +
Date.now(),
{
cache:"no-store"
}
);


if(!response.ok){

throw new Error(
"تعذر الاتصال بالخادم"
);

}


const data =
await response.json();


if(!data.success){

throw new Error(
data.error ||
"تعذر جلب الأمنيات"
);

}


return Array.isArray(data.wishes)
? data.wishes
: [];

}


/* =====================================================
   تحديث البيانات
===================================================== */

async function load(){

/*
   أهم نقطة:

   لو المستخدم يكتب الآن،
   لا نلمس الصفحة إطلاقًا.
*/

if(userIsTyping){

return;

}


try{

const newWishes =
await getWishes();


/*
   نحفظ البيانات الجديدة.
*/

wishes =
newWishes;


/*
   نحدث القائمة فقط.
*/

renderList();


/*
   ممنوع renderDetail هنا.

   لأن renderDetail ينشئ textarea جديد.
   وده كان سبب اختفاء الرد المكتوب.
*/

}
catch(error){

console.error(
"Load error:",
error
);


/*
   لا نمسح البيانات القديمة
   لو حصل خطأ في الاتصال.
*/

if(!wishes.length){

list.innerHTML =
`
<div class="empty">

تعذر الاتصال بالخادم.
<br>
سيتم المحاولة مرة أخرى تلقائيًا.

</div>
`;

}

}

}


/* =====================================================
   رسم قائمة الأمنيات
===================================================== */

function renderList(){

const unanswered =
wishes.filter(
wish => !wish.reply
).length;


totalCount.textContent =
wishes.length;


unansweredCount.textContent =
unanswered +
" بدون رد";


if(!wishes.length){

list.innerHTML =
`
<div class="empty">

لا توجد أمنيات حتى الآن.
<br>
عندما تصل أمنية ستظهر هنا.

</div>
`;

return;

}


const sorted =
[...wishes].sort(
function(a,b){

return new Date(b.date) -
new Date(a.date);

}
);


list.innerHTML =
sorted.map(
function(wish){

return `

<button
class="wish-item ${
wish.id === selectedId
? "active"
: ""
}"
data-id="${escapeHtml(wish.id)}">


<div class="wish-item-top">

<time>

${escapeHtml(
formatDate(wish.date)
)}

</time>


<span class="state">

${
wish.reply
? "تم الرد"
: "بانتظار الرد"
}

</span>

</div>


<p>

${escapeHtml(
wish.text
)}

</p>


</button>

`;

}
).join("");


/*
   أزرار الأمنيات
*/

document
.querySelectorAll(".wish-item")
.forEach(
function(button){

button.addEventListener(
"click",
function(){

/*
   عند اختيار أمنية جديدة،
   نوقف حالة الكتابة القديمة.
*/

userIsTyping =
false;

clearTimeout(
typingTimer
);


renderDetail(
button.dataset.id
);

}
);

}
);

}


/* =====================================================
   عرض تفاصيل الأمنية
===================================================== */

function renderDetail(id){

selectedId =
id;


const wish =
wishes.find(
function(item){

return item.id === id;

}
);


if(!wish){

return;

}


/*
   تحديث القائمة فقط.
*/

renderList();


/*
   إنشاء التفاصيل مرة واحدة
*/

detail.innerHTML = `

<div class="detail-head">


<div>

<h2>
أمنية وصلت إليك
</h2>


<div class="detail-meta">

${escapeHtml(
formatDate(wish.date)
)}

· الرقم

${escapeHtml(
wish.id
)}

</div>

</div>


<span class="tag">

${
wish.reply
? "تم الرد"
: "بانتظار ردك"
}

</span>


</div>


<div class="received">

${escapeHtml(
wish.text
)}

</div>


<label
class="response-label"
for="response">

اكتب ردك

</label>


<textarea
class="response-box"
id="response"
maxlength="500"
placeholder="اكتب رسالة صادقة ودافئة..."
></textarea>


<div class="detail-actions">


<span class="note">

سيرى صاحب الأمنية ردك في موقع الأمنيات.

</span>


<button
class="send"
id="sendButton">

إرسال الرد ✦

</button>


</div>


${
wish.reply
?
`

<div class="previous">

<h3>
الرد الحالي
</h3>

<p>

${escapeHtml(
wish.reply
)}

</p>

</div>

`
:
""
}

`;


/*
   إذا كان هناك رد سابق،
   يظهر في مربع الرد.
*/

if(wish.reply){

const field =
document.getElementById(
"response"
);

if(field){

field.value =
wish.reply;

}

}


/*
   زر إرسال الرد
*/

document
.getElementById("sendButton")
.addEventListener(
"click",
sendResponse
);


/*
   مراقبة الكتابة في مربع الرد
*/

const responseField =
document.getElementById(
"response"
);


if(responseField){

responseField.addEventListener(
"focus",
function(){

userIsTyping =
true;

}
);


responseField.addEventListener(
"input",
function(){

userIsTyping =
true;

clearTimeout(
typingTimer
);


/*
   بعد 10 ثواني من عدم الكتابة
   نسمح بالتحديث التلقائي.
*/

typingTimer =
setTimeout(
function(){

userIsTyping =
false;

},
10000
);

}


);


responseField.addEventListener(
"blur",
function(){

/*
   لا نوقفها فورًا عند الخروج
   حتى لا يحصل تحديث مفاجئ.
*/

clearTimeout(
typingTimer
);

typingTimer =
setTimeout(
function(){

userIsTyping =
false;

},
3000
);

}

);

}

}


/* =====================================================
   إرسال الرد
===================================================== */

async function sendResponse(){

const field =
document.getElementById(
"response"
);


const button =
document.getElementById(
"sendButton"
);


if(!field || !button){

return;

}


const reply =
field.value.trim();


if(!reply){

field.focus();

return;

}


const wish =
wishes.find(
function(item){

return item.id === selectedId;

}
);


if(!wish){

return;

}


/*
   إيقاف التحديث أثناء الإرسال
*/

userIsTyping =
true;


button.disabled =
true;

button.textContent =
"جاري إرسال الرد...";


try{


const response =
await fetch(
API_URL,
{

method:"POST",

headers:{
"Content-Type":
"text/plain;charset=utf-8"
},

body:JSON.stringify({

action:"reply",

id:wish.id,

reply:reply

})

}
);


if(!response.ok){

throw new Error(
"تعذر الاتصال بالخادم"
);

}


const data =
await response.json();


if(!data.success){

throw new Error(
data.error ||
"تعذر إرسال الرد"
);

}


/*
   تم الحفظ بنجاح.
*/

wish.reply =
reply;


/*
   إظهار الرد مباشرة.
*/

renderList();

renderDetail(
wish.id
);


/*
   نوقف حالة الكتابة
   بعد نجاح الإرسال.
*/

userIsTyping =
false;


}
catch(error){

console.error(
"Reply error:",
error
);


alert(
"تعذر إرسال الرد.\n\n" +
error.message
);


/*
   نعيد فتح الكتابة
*/

userIsTyping =
true;


}
finally{

const newButton =
document.getElementById(
"sendButton"
);


if(newButton){

newButton.disabled =
false;

newButton.textContent =
"إرسال الرد ✦";

}

}

}


/* =====================================================
   مراقبة الأمنيات الجديدة
===================================================== */


/*
   كل 5 ثواني:

   إذا لم تكن تكتب:
   نجلب الأمنيات الجديدة.

   وإذا كنت تكتب:
   لا يحدث أي شيء.

   والأهم:
   load() لا يستدعي renderDetail().
*/

setInterval(
function(){

if(!userIsTyping){

load();

}

},
5000
);


/* =====================================================
   التشغيل الأول
===================================================== */

load();


</script>

</body>
</html>
